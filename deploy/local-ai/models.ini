[Qwen/Qwen3-Embedding-0.6B]
model = gguf/qwen3-embed-0.6b-q8_0.gguf
embeddings = 1
pooling = last
ctx-size = 8192
n-gpu-layers = 99
# 默认的 physical batch 是 512 token，检索时一段剧情 + 上文很容易超过，
# 超了 llama-server 直接 500（"input (631 tokens) is too large to process"）。
# 实际遇到过，改成 2048。
ubatch-size = 2048

[Qwen/Qwen3-Reranker-0.6B]
model = gguf/qwen3-reranker-0.6b-q8_0.gguf
reranking = 1
ctx-size = 8192
n-gpu-layers = 99
# 同上：重排要把「上文 + 候选段落」整个塞进去，比向量化更长。
ubatch-size = 2048

[local-judge]
model = gguf/qwen3-4b-instruct-2507-q4_k_m.gguf
ctx-size = 8192
n-gpu-layers = 99
# 判断模型一次要读完整段对话加所有问题，同样会超过 512。
ubatch-size = 2048
